    <title>Soufiane Bennani - Community & Traffic Manager | Portfolio</title>
    <meta name="theme-color" content="#0077B6" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/assets/profil.png" as="image" type="image/png" fetchpriority="high" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <style>
      /* Critical CSS for initial render */
      * { box-sizing: border-box; }
      body { 
        margin: 0; 
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }
      /* Prevent layout shift */
      img { max-width: 100%; height: auto; display: block; }
      /* Optimize rendering */
      [data-section] { content-visibility: auto; contain-intrinsic-size: auto 500px; }
      /* Completely disable animations on mobile for performance */
      @media (max-width: 768px) {
        /* Exclude WhatsApp button from animation disabling */
        .whatsapp-button, .whatsapp-button * {
          animation: revert !important;
          transition: revert !important;
          transform: revert !important;
          will-change: auto !important;
        }
        /* Original rules for other elements */
        *:not(.whatsapp-button):not(.whatsapp-button *)::before,
        *:not(.whatsapp-button):not(.whatsapp-button *)::after { 
          animation: none !important;
          transition: none !important;
          transform: none !important;
          will-change: auto !important;
        }
        [data-motion]:not(.whatsapp-button) { transform: none !important; }
      }
      /* Optimize image rendering and prevent layout shifts */
      img { 
        image-rendering: -webkit-optimize-contrast;
        aspect-ratio: attr(width) / attr(height);
      }
      /* Prevent forced reflows */
      .container-custom { contain: layout style paint; }
      /* Optimize font loading */
      @font-face { font-display: swap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
